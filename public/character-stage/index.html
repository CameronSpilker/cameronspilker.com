<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Character stage</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #e9d6b8;
      }
      #c {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c" aria-label="Your character in 3D. Drag to rotate, pinch or scroll to zoom."></canvas>
    <script src="stage.js"></script>
  </body>
</html>
